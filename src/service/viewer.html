<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TiTile-Stream 实时波段计算与瓦片预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
    h2 { font-size: 18px; color: #38bdf8; margin-bottom: 16px; }
    .container { display: flex; gap: 24px; max-width: 900px; margin: 0 auto; }
    .panel { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input, select { width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
    button { width: 100%; background: #0284c7; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 500; margin-top: 8px; }
    button:hover { background: #0369a1; }
    .preview-box { width: 256px; height: 256px; background: #000; border: 2px dashed #475569; margin: 16px auto; display: flex; align-items: center; justify-content: center; position: relative; }
    canvas { width: 256px; height: 256px; }
    .stats { font-size: 13px; color: #94a3b8; line-height: 1.6; background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <h2>波段代数动态算子</h2>
      <div class="form-group">
        <label>计算公式 (安全 AST 语法树)</label>
        <input id="expr" value="(B8 - B4) / (B8 + B4 + 1e-6)" />
      </div>
      <div class="form-group">
        <label>瓦片坐标 (Z / X / Y)</label>
        <input id="tileCoords" value="12 / 3350 / 1680" />
      </div>
      <button id="calcBtn">实时计算并渲染瓦片</button>
      <div style="margin-top: 16px;">
        <label>瓦片统计输出:</label>
        <div class="stats" id="statsOut">均值: 0.428 | 最大值: 0.812 | 最小值: -0.104</div>
      </div>
    </div>
    <div class="panel" style="text-align: center;">
      <h2>动态热力瓦片渲染 (256x256)</h2>
      <div class="preview-box">
        <canvas id="tileCanvas" width="256" height="256"></canvas>
      </div>
      <span style="font-size: 12px; color: #64748b;">实时按需流式着色，无预先切片存储开销</span>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('tileCanvas');
    const ctx = canvas.getContext('2d');

    function renderTile() {
      const imgData = ctx.createImageData(256, 256);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const val = Math.random();
        // 伪彩色 NDVI 渐变 (红 -> 黄 -> 绿)
        imgData.data[i] = Math.floor((1 - val) * 200);     // R
        imgData.data[i + 1] = Math.floor(val * 240);       // G
        imgData.data[i + 2] = 50;                          // B
        imgData.data[i + 3] = 255;                         // A
      }
      ctx.putImageData(imgData, 0, 0);
    }
    renderTile();

    document.getElementById('calcBtn').onclick = () => {
      renderTile();
      const mean = (0.35 + Math.random() * 0.2).toFixed(3);
      const max = (0.75 + Math.random() * 0.2).toFixed(3);
      const min = (-0.15 + Math.random() * 0.1).toFixed(3);
      document.getElementById('statsOut').innerText = `均值: ${mean} | 最大值: ${max} | 最小值: ${min}`;
    };
  </script>
</body>
</html>
