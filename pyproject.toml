[project]
name = "titile-stream"
version = "0.1.0"
description = "Validated raster band algebra, XYZ reprojection and PNG tile prototype"
authors = [{ name = "Zhang Kuo" }]
dependencies = [
    "fastapi>=0.110.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "rasterio>=1.3.0"
]
requires-python = ">=3.10"

[tool.setuptools.package-data]
service = ["*.html", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
